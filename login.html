<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سجل متجرك</title><style>*{box-sizing:border-box;font-family:system-ui}body{background:#000;color:#fff;padding:20px}.box{max-width:380px;margin:30px auto;background:#111;border:1px solid #222;border-radius:16px;padding:20px}input{width:100%;padding:12px;margin:6px 0;background:#000;border:1px solid #333;border-radius:8px;color:#fff}button{width:100%;padding:12px;background:#ffaa00;color:#000;border:0;border-radius:8px;font-weight:800;cursor:pointer}</style></head><body><div class="box"><h2>سجل متجرك 🛍️</h2><p style="color:#888;font-size:12px">مربوط اونلاين - بيستحمل آلاف</p><input id="name" placeholder="اسمك"><input id="shop" placeholder="اسم المتجر"><input id="phone" placeholder="واتساب"><input id="pass" type="password" placeholder="كلمة سر"><button id="btn">سجل 🚀</button><p id="msg"></p><a href="index.html" style="color:#888">← السوق</a></div><script type="module">import{saveMerchant} from './firebase.js';btn.onclick=async()=>{if(!name.value||!shop.value)return alert('اكمل البيانات');btn.textContent='بحفظ...';btn.disabled=true;try{let d={name:name.value,shopName:shop.value,phone:phone.value,pass:pass.value,status:'pending',created:Date.now()};await saveMerchant(d);msg.textContent='✅ تم التسجيل! الادمن ح يقبلك';setTimeout(()=>location.href='tajer.html',1200);}catch(e){msg.textContent='خطأ: '+e;btn.disabled=false;btn.textContent='سجل 🚀';}}</script></body></html>
