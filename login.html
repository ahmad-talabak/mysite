<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>دخول التاجر</title><style>*{box-sizing:border-box;font-family:system-ui}body{background:#0a0a0a;color:#fff;margin:0;padding:20px;display:flex;min-height:100vh;align-items:center;justify-content:center}.c{background:#151515;border:1px solid #222;border-radius:16px;padding:24px;width:100%;max-width:380px}input{background:#000;border:1px solid #333;color:#fff;padding:13px;border-radius:10px;width:100%;margin:6px 0}button{background:#ffaa00;color:#000;border:none;padding:14px;border-radius:10px;font-weight:900;width:100%;margin-top:10px}</style></head><body><div class="c"><h2 style="color:#ffaa00;margin:0">🏪 دخول التاجر</h2><p style="color:#888;font-size:12px">كل تاجر عندو حساب براهو</p><input id="shop" placeholder="اسم محلك - مثلا محلات امدرمان"><input id="phone" placeholder="رقم تلفونك"><input id="pass" type="password" placeholder="كلمة سر"><button onclick="login()">دخول / تسجيل</button></div><script>function login(){if(!shop.value||!phone.value||!pass.value) return alert('اكمل');let all=JSON.parse(localStorage.getItem('talabak_merchants')||'[]');let ex=all.find(m=>m.phone==phone.value);if(ex){if(ex.pass!=pass.value) return alert('كلمة السر غلط');localStorage.setItem('talabak_current',ex.id)}else{let id='M'+Date.now();let m={id:id,shop:shop.value,phone:phone.value,pass:pass.value,wa:'249124341697',join:Date.now()};all.push(m);localStorage.setItem('talabak_merchants',JSON.stringify(all));localStorage.setItem('talabak_current',id)}location.href='tajer.html'}</script></body></html>
