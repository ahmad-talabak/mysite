<!DOCTYPE html>
<html dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>لوحة التحكم</title>
<style>body{background:#0a0a0a;color:white;padding:20px;font-family:sans-serif}input{width:90%;padding:12px;margin:5px;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:white}button{padding:12px 20px;border-radius:10px;border:0;font-weight:bold;cursor:pointer;margin:5px}.card{background:#1a1a1a;border:1px solid #333;border-radius:15px;padding:10px;margin:10px 0;display:flex;gap:10px;align-items:center}img{width:60px;height:60px;border-radius:10px;object-fit:cover}
#login{max-width:350px;margin:80px auto;text-align:center;background:#1a1a1a;padding:30px;border-radius:20px;border:1px solid #333}
</style></head><body>
<div id="login">
<h2>🔒 دخول خاص</h2>
<input id="u" placeholder="Ahmed"><br>
<input id="pw" type="password" placeholder="كلمة المرور"><br>
<button onclick="check()" style="background:#ff0080;color:white;width:95%">دخول</button>
<p id="err" style="color:#ff4444"></p>
</div>
<div id="panel" style="display:none">
<h1>⚙️ TALABAK ADMIN</h1>
<input id="n" placeholder="اسم المنتج"><br>
<input id="p" placeholder="السعر"><br>
<input id="img" placeholder="رابط الصورة"><br>
<button onclick="add()" style="background:#00ff88;width:95%">+ اضافة</button>
<hr><div id="list"></div>
<button onclick="save()" style="background:#25D366;width:95%">💾 حفظ</button>
<button onclick="localStorage.clear();location.reload()" style="background:#333;width:95%">خروج</button>
</div>
<script>
function check(){if(document.getElementById('u').value=="Ahmed" && document.getElementById('pw').value=="159357@"){localStorage.setItem('auth','1');document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';render();}else{document.getElementById('err').innerText="خطأ!";}}
if(localStorage.getItem('auth')=="1"){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';}
let items=JSON.parse(localStorage.getItem('talabak')||"[]");
function render(){document.getElementById('list').innerHTML=items.map((x,i)=>`<div class="card"><img src="${x.img}"><div style="flex:1"><b>${x.n}</b><br><small style="color:#00ff88">${x.p}</small></div><button onclick="items.splice(${i},1);render()" style="background:#ff4444">حذف</button></div>`).join('');}
function add(){let n=document.getElementById('n').value,p=document.getElementById('p').value,img=document.getElementById('img').value||"https://via.placeholder.com/300";if(!n||!p)return alert("اكتب الاسم والسعر");items.push({n,p,img});render();document.getElementById('n').value="";document.getElementById('p').value="";}
function save(){localStorage.setItem('talabak',JSON.stringify(items));alert("تم ✅ افتح المتجر");}
</script>
</body></html>
