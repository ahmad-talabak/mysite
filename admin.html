<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>لوحة الادمن</title><style>*{box-sizing:border-box;font-family:system-ui}body{background:#0a0a0a;color:#fff;margin:0;padding:10px}.box{max-width:700px;margin:auto}.card{background:#151515;border:1px solid #222;border-radius:12px;padding:14px;margin:8px 0}h2{color:#ffaa00;margin:0}input{background:#000;border:1px solid #333;color:#fff;padding:10px;border-radius:8px}.btn{background:#ffaa00;color:#000;border:none;padding:10px 14px;border-radius:8px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}.b{background:#000;border:1px solid #222;border-radius:8px;padding:10px;text-align:center}.b b{color:#ffaa00;display:block}</style></head><body><div class="box"><div class="card"><h2>👑 لوحة الادمن</h2><input id="adminPass" type="password" placeholder="كلمة سر الادمن 1234"><button class="btn" onclick="check()">دخول</button></div><div id="panel" style="display:none"><div class="card"><div class="grid"><div class="b"><small>التجار</small><b id="a1">0</b></div><div class="b"><small>المنتجات</small><b id="a2">0</b></div><div class="b"><small>الطلبات</small><b id="a3">0</b></div><div class="b"><small>عمولتك</small><b id="a4">0ج</b></div></div></div><div class="card"><div id="merch"></div></div><div class="card"><div id="prods"></div></div></div></div><script>function check(){if(adminPass.value=='1234'){panel.style.display='block';render()}else alert('غلط');}function render(){let ms=JSON.parse(localStorage.getItem('talabak_merchants')||'[]');let all=JSON.parse(localStorage.getItem('talabak_global')||'[]');let o=JSON.parse(localStorage.getItem('talabak_orders')||'[]');a1.innerText=ms.length;a2.innerText=all.length;a3.innerText=o.length;a4.innerText=all.reduce((a,b)=>a+(+b.profit||0)*0.1,0).toFixed(0)+'ج';merch.innerHTML=ms.map(m=>`<div style="display:flex;justify-content:space-between;background:#111;border:1px solid #222;padding:6px;margin:3px 0;border-radius:6px;font-size:12px"><span>${m.shop} - ${m.phone}</span><span>${all.filter(x=>x.merchantId==m.id).length} منتج</span></div>`).join('');prods.innerHTML=all.map(p=>`<div style="background:#111;border:1px solid #222;padding:5px;margin:3px 0;border-radius:6px;font-size:11px">${p.name} - ${p.shopName} - ${p.sell}ج</div>`).join('');}</script></body></html>
