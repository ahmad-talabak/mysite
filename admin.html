<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>الادمن - تحكم كامل</title><style>*{box-sizing:border-box;font-family:system-ui}body{background:#0a0a0a;color:#fff;margin:0;padding:10px}.box{max-width:780px;margin:auto}.card{background:#151515;border:1px solid #222;border-radius:12px;padding:14px;margin:8px 0}input{background:#000;border:1px solid #333;color:#fff;padding:10px;border-radius:8px;width:80%}.btn{background:#ffaa00;color:#000;border:none;padding:10px 16px;border-radius:8px;font-weight:900;cursor:pointer}.btn2{background:#222;color:#fff;border:1px solid #444;padding:7px 12px;border-radius:7px;cursor:pointer;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}.b{background:#000;border:1px solid #222;border-radius:10px;padding:10px;text-align:center}.merchant{border:1px solid #333;border-radius:12px;padding:12px;margin:8px 0;background:#111}.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:900}</style></head><body><div class="box">
<div class="card"><h2 style="color:#ffaa00;margin:0">👑 ادارة طلبك</h2><div style="display:flex;gap:6px;margin-top:8px"><input id="adminPass" type="password" placeholder="1234"><button class="btn" onclick="login()">دخول</button></div><small style="color:#666" id="msg"></small></div>
<div id="panel" style="display:none">
<div class="card"><div class="grid"><div class="b"><small>تجار</small><b id="c1" style="color:#fff">0</b></div><div class="b"><small>منتظر</small><b id="c2" style="color:#ffaa00">0</b></div><div class="b"><small>مقبول</small><b id="c3" style="color:#0f5">0</b></div><div class="b"><small>عمولتك</small><b id="c4" style="color:#ffaa00">0ج</b></div></div><button class="btn2" onclick="render()" style="margin-top:6px">🔄 تحديث</button></div>
<div class="card"><h3 style="margin:0 0 8px">🏪 كل التجار - اقبل / ارفض / ازل</h3><div id="list"></div></div>
</div></div>
<script>
let logged=false;
function login(){
 if(adminPass.value.trim()!='1234'){msg.innerText='❌ الباسورد 1234';msg.style.color='#f55';return;}
 logged=true; panel.style.display='block'; msg.innerText='✅ تم الدخول'; msg.style.color='#0f5'; render();
}
function getMerchants(){return JSON.parse(localStorage.getItem('talabak_merchants')||'[]');}
function saveMerchants(arr){localStorage.setItem('talabak_merchants',JSON.stringify(arr));}
function getProducts(){return JSON.parse(localStorage.getItem('talabak_global')||'[]');}
function saveProducts(arr){localStorage.setItem('talabak_global',JSON.stringify(arr));}
function render(){
 let ms=getMerchants(); let all=getProducts();
 c1.innerText=ms.length; c2.innerText=ms.filter(m=> (m.status||'pending')=='pending').length; c3.innerText=ms.filter(m=>m.status=='approved').length;
 let totalProfit=all.reduce((a,b)=>a+(parseFloat(b.profit)||0),0); c4.innerText=(totalProfit*0.1).toFixed(0)+'ج';
 if(ms.length==0){list.innerHTML='<p style="color:#555;text-align:center">لا يوجد تجار مسجلين<br><small>خلي تاجر يسجل من login.html</small></p>';return;}
 list.innerHTML=ms.map(m=>{
  let mine=all.filter(x=>x.merchantId==m.id);
  let st=m.status||'pending';
  let color=st=='approved'?'#0f5':st=='rejected'?'#f55':'#ffaa00';
  let txt=st=='approved'?'✅ مقبول':st=='rejected'?'❌ مرفوض':'⏳ منتظر';
  return `<div class="merchant" style="border-color:${color}">
   <div style="display:flex;justify-content:space-between;align-items:center">
    <div><b style="font-size:15px">${m.shop||'بدون اسم'}</b><br><small style="color:#888">${m.phone||''} | ID: ${m.id}</small><br><span class="badge" style="background:${color};color:${st=='pending'?'#000':'#fff'}">${txt}</span> <small style="color:#888">${mine.length} منتج</small></div>
    <div style="text-align:left"><small>ربحه الصافي</small><br><b style="color:#0f5">${(mine.reduce((a,b)=>a+(parseFloat(b.profit)||0),0)*0.9).toFixed(0)}ج</b><br><small style="color:#ffaa00">عمولتك ${(mine.reduce((a,b)=>a+(parseFloat(b.profit)||0),0)*0.1).toFixed(0)}ج</small></div>
   </div>
   <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
    <button class="btn" style="background:#0f5" onclick="setStatus('${m.id}','approved')">✅ قبول</button>
    <button class="btn" style="background:#f55;color:#fff" onclick="setStatus('${m.id}','rejected')">❌ رفض</button>
    <button class="btn2" onclick="toggleStore('${m.id}')">👁️ شوف المتجر</button>
    <button class="btn2" style="background:#500;border-color:#800;color:#f88" onclick="removeMerchant('${m.id}')">🗑️ ازالة نهائية</button>
   </div>
   <div id="store-${m.id}" style="display:none;margin-top:10px;background:#000;border:1px solid #222;border-radius:8px;padding:8px"></div>
  </div>`;
 }).join('');
}
function setStatus(id,newStatus){
 let ms=getMerchants();
 let idx=ms.findIndex(x=>String(x.id)==String(id));
 if(idx==-1) return alert('تاجر غير موجود');
 ms[idx].status=newStatus;
 saveMerchants(ms);
 alert((newStatus=='approved'?'تم قبول':'تم رفض')+' '+ms[idx].shop);
 render();
}
function removeMerchant(id){
 if(!confirm('⚠️ متأكد داير تزيل التاجر ده نهائي؟\nح يتم حذف متجرو ومنتجاتو كلها!')) return;
 let ms=getMerchants(); let all=getProducts();
 let m=ms.find(x=>String(x.id)==String(id));
 saveMerchants(ms.filter(x=>String(x.id)!=String(id)));
 saveProducts(all.filter(p=>String(p.merchantId)!=String(id)));
 alert('تمت ازالة '+ (m?m.shop:'التاجر') +' نهائي');
 render();
}
function toggleStore(mid){
 let all=getProducts(); let mine=all.filter(x=>String(x.merchantId)==String(mid));
 let div=document.getElementById('store-'+mid);
 if(div.style.display=='none'){div.style.display='block';
  div.innerHTML=mine.length?mine.map(p=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #111"><span><img src="${p.img}" style="width:28px;height:28px;border-radius:4px;vertical-align:middle"> ${p.name}</span><span style="color:#888">${p.cost||0}→${p.sell} = <b style="color:#0f5">${p.profit}ج</b></span></div>`).join(''):'<small style="color:#666">لا يوجد منتجات</small>';
 }else div.style.display='none';
}
</script></body></html>
