<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ادمن - طلبك</title><style>*{box-sizing:border-box;font-family:system-ui}body{background:#050505;color:#fff;margin:0}header{background:#111;padding:10px;border-bottom:1px solid #222;display:flex;justify-content:space-between} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;padding:8px}.card{background:#151515;border:1px solid #222;border-radius:12px;padding:12px}.b{padding:7px 10px;border:0;border-radius:6px;font-weight:700;cursor:pointer;margin:2px}.ok{background:#0f5;color:#000}.no{background:#333;color:#fff}.del{background:#f33;color:#fff}</style></head><body><header><b>👑 ادمن طلبك - اونلاين</b><span id="cnt" style="background:#ffaa00;color:#000;padding:3px 10px;border-radius:20px">0</span></header><div style="padding:8px"><button onclick="filt='pending';render()" class="b" style="background:#ffaa00">⏳ انتظار</button><button onclick="filt='approved';render()" class="b ok">✅ مقبولين</button><button onclick="filt='all';render()" class="b no">الكل</button><button onclick="load()" class="b no">🔄 تحديث</button></div><div id="list" class="grid">جاري التحميل من السحابة...</div><script type="module">import{getMerchants,updateMerchant,deleteMerchant} from './firebase.js';let all=[],filt='pending';window.load=async()=>{try{all=await getMerchants();cnt.textContent=all.length;render();}catch(e){list.innerHTML='خطأ في السيرفر: '+e}};window.render=()=>{let L=filt=='all'?all:all.filter(m=>m.status==filt);if(!L.length){list.innerHTML='<p style=color:#888>لا يوجد</p>';return;}list.innerHTML=L.map(m=>`<div class=card><b>${m.shopName}</b><br><small style=color:#888>${m.name} - ${m.phone}</small><br><small>${m.status}</small><div style=margin-top:8px><button class="b ok" onclick="ok('${m._id}')">قبول</button><button class="b no" onclick="no('${m._id}')">رفض</button><button class="b del" onclick="delM('${m._id}')">ازالة نهائية 🗑️</button></div></div>`).join('')};window.ok=async(id)=>{let o=all.find(x=>x._id==id);await updateMerchant(id,{...o,status:'approved'});load()};window.no=async(id)=>{let o=all.find(x=>x._id==id);await updateMerchant(id,{...o,status:'rejected'});load()};window.delM=async(id)=>{if(!confirm('تمسح نهائي من السحابة؟'))return;await deleteMerchant(id);load()};load();</script></body></html>
