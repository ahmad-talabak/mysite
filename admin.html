<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>لوحة طلبك</title>
<style>*{box-sizing:border-box;font-family:system-ui}body{background:#0a0a0a;color:#fff;margin:0;padding:12px}.card{background:#151515;border:1px solid #222;border-radius:15px;padding:15px;margin:10px 0;max-width:600px;margin:10px auto}input,select{background:#000;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;width:100%;margin:5px 0}label{color:#ffaa00;font-size:13px;font-weight:700}.btn{background:#ffaa00;color:#000;border:none;padding:12px;border-radius:10px;font-weight:900;width:100%;cursor:pointer;margin-top:8px}.prod{background:#111;border:1px solid #222;border-radius:12px;padding:10px;margin:8px 0;display:flex;gap:10px;align-items:center}.prod img{width:60px;height:60px;object-fit:cover;border-radius:8px}</style></head>
<body>
<div class="card"><h2 style="color:#ffaa00;margin:0">⚙️ لوحة تحكم طلبك</h2><p style="color:#888;font-size:12px">اضف منتجات مع صور</p>
<label>اسم المنتج</label><input id="name" placeholder="ايفون 13">
<label>اسم المحل الحقيقي</label><input id="shopName" placeholder="محلات ابوعبيدة">
<label>السعر</label><input id="price" type="number" placeholder="500000">
<label>التصنيف</label><select id="cat"><option>الكترونيات</option><option>ملابس</option><option>عطور</option><option>غذائية</option><option>اخرى</option></select>
<label>رابط الصورة (انسخ رابط من فيسبوك او قوقل)</label><input id="img" placeholder="https://...jpg">
<button class="btn" onclick="add()">➕ اضف المنتج</button>
<button class="btn" style="background:#222;color:#fff;border:1px solid #333" onclick="download()">📥 تحميل products.json وارفعه</button>
</div>
<div class="card"><h3>المنتجات الحالية</h3><div id="list"></div></div>
<script>
let products=JSON.parse(localStorage.getItem('talabak')||'[]');
function render(){list.innerHTML=products.map((p,i)=>`<div class="prod"><img src="${p.img||'https://via.placeholder.com/60?text=No+Img'}" onerror="this.src='https://via.placeholder.com/60'"><div><b>${p.name}</b><br><small>🏬 ${p.shopName} - ${p.price}ج</small></div><button onclick="del(${i})" style="margin-right:auto;background:#300;color:#f55;border:none;padding:6px 10px;border-radius:6px">X</button></div>`).join('');}
function add(){
let p={name:name.value,shopName:shopName.value,price:price.value,sell:price.value,category:cat.value,img:img.value, vendor:shopName.value};
if(!p.name||!p.price) return alert('اكتب الاسم والسعر');
products.push(p);localStorage.setItem('talabak',JSON.stringify(products));render();name.value='';price.value='';img.value='';
alert('تمت الاضافة - دوس تحميل products.json');
}
function del(i){products.splice(i,1);localStorage.setItem('talabak',JSON.stringify(products));render();}
function download(){
let blob=new Blob([JSON.stringify(products,null,2)],{type:'application/json'});
let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='products.json';a.click();
alert('الان ارفع الملف ده في GitHub بنفس الاسم products.json - استبدل القديم');
}
render();
// حمل القديم لو موجود
fetch('products.json').then(r=>r.json()).then(d=>{if(!products.length&&d.length){products=d;localStorage.setItem('talabak',JSON.stringify(products));render();}}).catch(()=>{});
</script>
</body></html>
