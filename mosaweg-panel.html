<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة المسوق - اضافة منتج</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;padding:15px;max-width:500px;margin:auto}
input{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #333;background:#111;color:#fff;box-sizing:border-box}
button{padding:14px;width:100%;border-radius:30px;border:0;background:linear-gradient(45deg,#ff0080,#7928ca);color:#fff;font-weight:bold;margin-top:10px;font-size:16px}
.card{background:#1a1a1a;border:1px solid #333;border-radius:15px;padding:10px;margin:10px 0;display:flex;align-items:center;gap:10px}
#preview img{width:100%;border-radius:15px;margin-top:10px;max-height:300px;object-fit:cover}
</style>
</head>
<body>
<h2>📸 اضف منتج جديد</h2>
<p style="color:#aaa">اختار صورة من تلفونك</p>

<input id="p_name" placeholder="اسم المنتج مثلا: ساعة ذكية">
<input id="p_price" placeholder="السعر مثلا: 25000 SDG">
<input type="file" id="p_file" accept="image/*">

<div id="preview"></div>
<button onclick="addProd()">➕ اضف للمتجر</button>
<button onclick="location.href='index.html'" style="background:#222">🛒 شوف المتجر</button>

<div id="list"></div>

<script>
let items = JSON.parse(localStorage.getItem('talabak')||"[]");
let imgData = "";

document.getElementById('p_file').addEventListener('change', function(e){
  let reader = new FileReader();
  reader.onload = function(ev){
    imgData = ev.target.result;
    document.getElementById('preview').innerHTML = '<img src="'+imgData+'">';
  }
  reader.readAsDataURL(e.target.files[0]);
});

function addProd(){
  let n = document.getElementById('p_name').value;
  let p = document.getElementById('p_price').value;
  if(!n ||!p ||!imgData){ alert("اكتب الاسم والسعر واختار صورة"); return; }
  items.push({n:n, p:p, img:imgData});
  localStorage.setItem('talabak', JSON.stringify(items));
  render();
  alert("✅ تمت الاضافة! افتح المتجر بتشوفه");
  document.getElementById('p_name').value="";
  document.getElementById('p_price').value="";
}

function render(){
  let html = "<h3 style='margin-top:20px'>منتجاتك:</h3>";
  for(let i=0;i<items.length;i++){
    html += '<div class="card"><img src="'+items[i].img+'" style="width:60px;height:60px;border-radius:10px;object-fit:cover"><div><b>'+items[i].n+'</b><br><span style="color:#00ff88">'+items[i].p+'</span></div><button onclick="delProd('+i+')" style="width:auto;background:#ff4444;padding:6px 12px;margin-right:auto">حذف</button></div>';
  }
  document.getElementById('list').innerHTML = html;
}
function delProd(i){
  items.splice(i,1);
  localStorage.setItem('talabak', JSON.stringify(items));
  render();
}
render();
</script>
</body>
</html>
