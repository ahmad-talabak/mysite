<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>انضم كمسوق</title>
<style>body{background:#f5f5f5;font-family:sans-serif;padding:20px}form{background:#fff;padding:20px;border-radius:12px;max-width:400px;margin:auto}input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #ccc}button{background:#111;color:#fff;padding:12px;width:100%;border:none;border-radius:8px;cursor:pointer}</style></head><body>
<h2 style="text-align:center">طلب انضمام كمسوق</h2>
<form onsubmit="register(event)"><input id="name" placeholder="اسمك" required><input id="phone" placeholder="رقم واتساب مثال 2499xxxxxxx" required><input id="code" placeholder="كود خاص بيك مثال ahmad" required><button>ارسال الطلب</button></form>
<p id="msg" style="text-align:center;margin-top:15px"></p>
<script>
function register(e){e.preventDefault();
let marketers=JSON.parse(localStorage.getItem('marketers')||'[]');
let m={name:document.getElementById('name').value,phone:document.getElementById('phone').value,code:document.getElementById('code').value.toLowerCase(),approved:false};
if(marketers.find(x=>x.code==m.code)){alert('الكود مستخدم اختار كود تاني');return;}
marketers.push(m);localStorage.setItem('marketers',JSON.stringify(marketers));
document.getElementById('msg').innerText='تم ارسال طلبك! انتظر موافقة الإدارة. رابطك سيكون:?ref='+m.code;
e.target.reset();
}
</script></body></html>
