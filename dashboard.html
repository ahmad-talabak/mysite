<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم - طلبك</title>
<style>body{font-family:sans-serif;background:#f4f5f7;margin:0;padding:12px}header{background:#2e9d4a;color:white;padding:14px;border-radius:12px;display:flex;justify-content:space-between}.card{background:white;padding:14px;border-radius:12px;margin-top:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.item{display:flex;gap:10px;align-items:center;padding:10px;background:#f9f9f9;border-radius:10px;margin-top:8px}.item img{width:55px;height:55px;border-radius:8px;object-fit:cover}.btn{padding:8px 12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}.green{background:#2e9d4a;color:white}.red{background:#ff3b3b;color:white}</style></head><body>
<header><b>لوحة تحكم طلبك 👑</b><a href="index.html" style="color:white;text-decoration:none">🏠 السوق</a></header>

<div class="card"><h3>➕ إضافة منتج جديد</h3>
<input id="pname" placeholder="اسم المنتج - مثال: تيشيرت" style="width:100%;padding:12px;border-radius:8px;border:1px solid #ddd;margin-top:8px">
<input id="pprice" type="number" placeholder="السعر - مثال: 15000" style="width:100%;padding:12px;border-radius:8px;border:1px solid #ddd;margin-top:8px">
<input id="pimg" placeholder="رابط الصورة" style="width:100%;padding:12px;border-radius:8px;border:1px solid #ddd;margin-top:8px">
<button class="btn green" style="width:100%;margin-top:10px;padding:12px" onclick="addProd()">حفظ المنتج ✅</button>
</div>

<div class="card"><h3>📦 منتجاتي (<span id="count">0</span>)</h3><div id="list">جاري التحميل...</div></div>

<script src="firebase.js"></script><script>
let myProds=[];
async function load(){
 try{
  let all = await FirebaseDB.getProducts();
  myProds = all;
  document.getElementById('count').innerText = all.length;
  if(all.length===0){document.getElementById('list').innerHTML='لسه ما اضفت منتجات'; return;}
  document.getElementById('list').innerHTML = all.map(p=>`<div class="item"><img src="${p.image}" onerror="this.src='https://via.placeholder.com/100'"><div style="flex:1"><b>${p.name}</b><br><small>${p.price} SDG</small></div><button class="btn red" onclick="delProd('${p._id}')">حذف</button></div>`).join('');
 }catch(e){document.getElementById('list').innerHTML='خطأ في التحميل: '+e.message}
}
async function addProd(){
 let name=document.getElementById('pname').value.trim();
 let price=parseInt(document.getElementById('pprice').value);
 let image=document.getElementById('pimg').value.trim() || 'https://via.placeholder.com/400?text=طلبك';
 if(!name||!price)return alert('اكتب الاسم والسعر');
 let stores = await FirebaseDB.getStores(); let storeId = stores[0]?stores[0]._id:'demo';
 await FirebaseDB.addProduct({name,price,image,storeId});
 alert('تم ✅'); document.getElementById('pname').value=''; document.getElementById('pprice').value=''; load();
}
async function delProd(id){ if(!confirm('تحذف؟'))return; await FirebaseDB.deleteProduct(id); load(); }
load();
</script></body></html>
