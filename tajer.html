<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التاجر</title>
<style>body{font-family:sans-serif;padding:20px;background:#f5f5f5}input,button{padding:10px;margin:5px;width:95%}</style>
</head><body>
<h2>🛍️ لوحة التاجر</h2>
<div id="storeName"></div>
<h3>اضافة منتج</h3>
<input id="pname" placeholder="اسم المنتج">
<input id="pprice" type="number" placeholder="السعر">
<input id="pimg" placeholder="رابط الصورة">
<button onclick="addProd()">اضافة</button>
<h3>منتجاتي</h3>
<div id="myProds"></div>
<script src="firebase.js"></script>
<script>
let sid = localStorage.getItem("storeId");
if(!sid){ alert("سجل دخول اول"); location.href="login.html"; }
async function load(){
 let stores = await FirebaseDB.getStores();
 let s = stores.find(x=>x._id===sid);
 if(s) document.getElementById("storeName").innerHTML = "متجر: <b>"+s.name+"</b>";
 let prods = await FirebaseDB.getProductsByStore(sid);
 document.getElementById("myProds").innerHTML = prods.map(p=>`<div style="background:white;padding:10px;margin:5px;border-radius:8px"><img src="${p.image}" style="width:60px;height:60px;object-fit:cover"><br>${p.name} - ${p.price} جنيه <button onclick="delProd('${p._id}')">حذف</button></div>`).join("");
}
async function addProd(){
 let obj={storeId:sid,name:pname.value,price:pprice.value,image:pimg.value};
 await FirebaseDB.createProduct(obj);
 pname.value="";pprice.value="";pimg.value=""; load();
}
async function delProd(id){ await FirebaseDB.deleteProduct(id); load(); }
load();
</script></body></html>
