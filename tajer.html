<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ارباحي</title><style>*{box-sizing:border-box;font-family:system-ui}body{background:#0a0a0a;color:#fff;margin:0;padding:10px}.box{max-width:550px;margin:auto}.card{background:#151515;border:1px solid #222;border-radius:14px;padding:14px;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.b{background:#000;border:1px solid #222;border-radius:10px;padding:10px;text-align:center}.b b{color:#0f5;display:block;font-size:16px}.b.gold b{color:#ffaa00}input{background:#000;border:1px solid #333;color:#fff;padding:11px;border-radius:8px;width:100%;margin:4px 0}.btn{background:#ffaa00;color:#000;border:none;padding:12px;border-radius:10px;font-weight:900;width:100%;margin-top:6px}.prev{height:130px;background:#000;border:1px dashed #333;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.prev img{width:100%;height:100%;object-fit:cover}table{width:100%;border-collapse:collapse;font-size:11px}th{color:#888;border-bottom:1px solid #222;padding:6px;text-align:right}td{padding:6px;border-bottom:1px solid #111}</style></head><body><div class="box">
<div class="card" id="status"></div>
<div class="card"><div style="display:flex;justify-content:space-between"><h3 style="margin:0;color:#ffaa00" id="shop"></h3><button onclick="localStorage.removeItem('talabak_current');location.href='login.html'" style="background:#222;color:#fff;border:1px solid #333;border-radius:6px;padding:4px 8px;font-size:11px">خروج</button></div><div class="grid" style="margin-top:8px"><div class="b"><small>منتجاتي</small><b id="p1">0</b></div><div class="b gold"><small>مبيعاتي</small><b id="p2">0</b></div><div class="b"><small>صافي ربحي</small><b id="p3">0ج</b></div></div><div class="grid"><div class="b"><small>اجمالي المبيعات</small><b id="p4" style="color:#fff">0ج</b></div><div class="b"><small>راس المال</small><b id="p5" style="color:#f55">0ج</b></div><div class="b"><small>عمولة المنصة 10%</small><b id="p6" style="color:#aaf">0ج</b></div></div></div>
<div class="card"><h4 style="margin:0 0 6px">➕ اضف منتج جديد</h4><input id="name" placeholder="اسم المنتج"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input id="cost" type="number" placeholder="سعر الشراء"><input id="price" type="number" placeholder="سعر البيع"></div><small id="calc" style="color:#0f5"></small><input type="file" accept="image/*" onchange="load(this)"><div class="prev" id="prev">📸</div><button class="btn" onclick="pub()">🚀 انشر</button></div>
<div class="card"><h4 style="margin:0 0 6px">📊 تفاصيل الارباح</h4><table><thead><tr><th>المنتج</th><th>شراء</th><th>بيع</th><th>ربح</th><th></th></tr></thead><tbody id="list"></tbody></table></div>
<div class="card" style="text-align:center"><a href="index.html" style="color:#666;font-size:12px;margin:6px">الموقع</a><a href="admin.html" style="color:#ffaa00;font-size:12px;margin:6px">ادمن</a></div></div>
<script>
let mid=localStorage.getItem('talabak_current');if(!mid) location.href='login.html';let ms=JSON.parse(localStorage.getItem('talabak_merchants')||'[]');let me=ms.find(m=>m.id==mid);if(!me) location.href='login.html';shop.innerText='🏪 '+me.shop;let st=me.status||'pending';status.innerHTML=st=='approved'?`<div style="background:#0a3;color:#fff;padding:8px;border-radius:8px;text-align:center;font-size:12px">✅ متجرك شغال - ربحك شغال</div>`:st=='rejected'?`<div style="background:#a00;color:#fff;padding:8px;border-radius:8px;text-align:center">❌ مرفوض</div>`:`<div style="background:#a80;color:#000;padding:8px;border-radius:8px;text-align:center">⏳ قيد المراجعة</div>`;
let img='';cost.oninput=price.oninput=()=>{let c=+cost.value||0,p=+price.value||0;calc.innerText=p>c?`ربحك: ${p-c}ج | عمولة المنصة: ${((p-c)*0.1).toFixed(0)}ج | صافي ليك: ${((p-c)*0.9).toFixed(0)}ج`:''}
function load(i){let r=new FileReader();r.onload=e=>{img=e.target.result;prev.innerHTML=`<img src="${img}">`};r.readAsDataURL(i.files[0])}
function pub(){if(st!='approved') return alert('لسه ما مقبول');if(!name.value||!price.value||!img) return alert('اكمل');let all=JSON.parse(localStorage.getItem('talabak_global')||'[]');let c=+cost.value||0,p=+price.value,profit=p-c;all.unshift({id:Date.now(),merchantId:mid,shopName:me.shop,name:name.value,cost:c,sell:p,price:p,profit:profit,net:profit*0.9,commission:profit*0.1,img:img});localStorage.setItem('talabak_global',JSON.stringify(all));name.value=cost.value=price.value='';img='';prev.innerHTML='📸';calc.innerText='';render()}
function render(){let all=JSON.parse(localStorage.getItem('talabak_global')||'[]');let mine=all.filter(x=>x.merchantId==mid);let orders=JSON.parse(localStorage.getItem('talabak_orders')||'[]');let sold=orders.filter(o=>o.items.some(it=>it.merchantId==mid)).length;let totalSell=mine.reduce((a,b)=>a+(+b.sell||0),0);let totalCost=mine.reduce((a,b)=>a+(+b.cost||0),0);let totalProfit=mine.reduce((a,b)=>a+(+b.profit||0),0);p1.innerText=mine.length;p2.innerText=sold;p3.innerText=(totalProfit*0.9).toFixed(0)+'ج';p4.innerText=totalSell+'ج';p5.innerText=totalCost+'ج';p6.innerText=(totalProfit*0.1).toFixed(0)+'ج';list.innerHTML=mine.map(m=>`<tr><td>${m.name}</td><td style="color:#f55">${m.cost}ج</td><td style="color:#0f5">${m.sell}ج</td><td style="color:#ffaa00">${m.profit}ج</td><td><button onclick="del(${m.id})" style="background:#222;color:#fff;border:1px solid #333;border-radius:4px">×</button></td></tr>`).join('')||'<tr><td colspan=5 style="color:#555;text-align:center">لا يوجد</td></tr>';}
function del(id){let all=JSON.parse(localStorage.getItem('talabak_global')||'[]');localStorage.setItem('talabak_global',JSON.stringify(all.filter(x=>x.id!=id)));render();}render();
</script></body></html>
