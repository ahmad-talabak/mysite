<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>لوحة التاجر</title><style>*{box-sizing:border-box;font-family:system-ui}body{background:#0a0a0a;color:#fff;margin:0;padding:12px}.box{max-width:500px;margin:auto}.card{background:#151515;border:1px solid #222;border-radius:16px;padding:16px;margin:8px 0}input{background:#000;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;width:100%;margin:5px 0}.btn{background:#ffaa00;color:#000;border:none;padding:13px;border-radius:10px;font-weight:900;width:100%;margin-top:8px}.prev{height:150px;background:#000;border:1px dashed #333;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.prev img{width:100%;height:100%;object-fit:cover}</style></head><body><div class="box"><div class="card" id="statusCard"></div><div class="card"><h3 style="margin:0;color:#ffaa00" id="shopName">🏪</h3><p style="color:#888;font-size:11px" id="info"></p><label>اسم المنتج</label><input id="name"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div><label>سعر التاجر</label><input id="cost" type="number"></div><div><label>سعر البيع</label><input id="price" type="number"></div></div><input type="file" accept="image/*" onchange="load(this)"><div class="prev" id="prev">📸</div><button class="btn" onclick="pub()">🚀 انشر</button></div><div class="card"><h3 style="margin:0">📦 منتجاتي</h3><div id="list"></div></div></div><script>
let mid=localStorage.getItem('talabak_current');if(!mid) location.href='login.html';let merchants=JSON.parse(localStorage.getItem('talabak_merchants')||'[]');let me=merchants.find(m=>m.id==mid);if(!me) location.href='login.html';shopName.innerText='🏪 '+me.shop;info.innerText=me.phone+' | '+me.id;let st=me.status||'pending';statusCard.innerHTML=st=='approved'?`<div style="background:#0a3;color:#fff;padding:10px;border-radius:8px;text-align:center">✅ متجرك مقبول وشغال<br><a href="index.html?shop=${mid}" style="color:#fff;text-decoration:underline">👁️ شوف متجري</a></div>`:st=='rejected'?`<div style="background:#a00;color:#fff;padding:10px;border-radius:8px;text-align:center">❌ متجرك مرفوض من الادمن<br>تواصل مع الادارة</div>`:`<div style="background:#a80;color:#000;padding:10px;border-radius:8px;text-align:center">⏳ حسابك قيد المراجعة<br>الادمن ح يقبلك قريب</div>`;
let img='';function load(i){let r=new FileReader();r.onload=e=>{img=e.target.result;prev.innerHTML=`<img src="${img}">`};r.readAsDataURL(i.files[0])}
function pub(){if(st!='approved') return alert('حسابك لسه ما مقبول من الادمن');if(!name.value||!price.value||!img) return alert('اكمل');let all=JSON.parse(localStorage.getItem('talabak_global')||'[]');all.unshift({id:Date.now(),merchantId:mid,shopName:me.shop,merchantPhone:me.phone,name:name.value,price:cost.value||price.value,sell:price.value,profit:(+price.value)-(+cost.value||+price.value),img:img});localStorage.setItem('talabak_global',JSON.stringify(all));name.value=cost.value=price.value='';img='';prev.innerHTML='📸';render()}
function render(){let all=JSON.parse(localStorage.getItem('talabak_global')||'[]');let mine=all.filter(x=>x.merchantId==mid);list.innerHTML=mine.map(p=>`<div style="display:flex;gap:6px;background:#111;border:1px solid #222;border-radius:8px;padding:6px;margin:4px 0"><img src="${p.img}" style="width:40px;height:40px;border-radius:6px"><div><b style="font-size:12px">${p.name}</b><br><small style="color:#888">${p.sell}ج</small></div><button onclick="del(${p.id})" style="margin-right:auto;background:#222;color:#fff;border:1px solid #333;padding:3px 8px;border-radius:5px">×</button></div>`).join('')||'<p style=color:#555;text-align:center>لا يوجد</p>';}
function del(id){let all=JSON.parse(localStorage.getItem('talabak_global')||'[]');localStorage.setItem('talabak_global',JSON.stringify(all.filter(x=>x.id!=id)));render();}render();
</script></body></html>
