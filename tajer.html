<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>لوحة التاجر</title><style>*{box-sizing:border-box;font-family:system-ui}body{background:#0a0a0a;color:#fff;margin:0;padding:12px}.box{max-width:500px;margin:auto}.card{background:#151515;border:1px solid #222;border-radius:16px;padding:16px;margin:8px 0}h2{margin:0;color:#ffaa00}input{background:#000;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;width:100%;margin:5px 0}label{font-size:11px;color:#999}.btn{background:#ffaa00;color:#000;border:none;padding:13px;border-radius:10px;font-weight:900;width:100%;margin-top:8px}.prev{height:160px;background:#000;border:1px dashed #333;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.prev img{width:100%;height:100%;object-fit:cover}.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.s{background:#000;border:1px solid #222;border-radius:10px;padding:8px;text-align:center}.s b{color:#ffaa00;display:block}</style></head><body><div class="box"><div class="card"><div style="display:flex;justify-content:space-between"><h2 id="shopName">🏪</h2><button onclick="logout()" style="background:#222;color:#fff;border:1px solid #333;border-radius:8px;padding:6px 10px">خروج</button></div><p style="color:#888;font-size:11px" id="info"></p><div class="stat"><div class="s"><small>منتجاتي</small><b id="c1">0</b></div><div class="s"><small>مبيعاتي</small><b id="c2">0</b></div><div class="s"><small>ربحي</small><b id="c3">0ج</b></div></div></div>
<div class="card"><label>اسم المنتج</label><input id="name" placeholder="سماعة"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div><label>سعر التاجر</label><input id="cost" type="number" placeholder="10000"></div><div><label>سعر البيع</label><input id="price" type="number" placeholder="15000"></div></div><small id="pr" style="color:#0f0"></small><label>صورة</label><input type="file" accept="image/*" onchange="load(this)"><div class="prev" id="prev">📸</div><button class="btn" onclick="pub()">🚀 انشر باسمي</button></div>
<div class="card"><h3 style="margin:0 0 6px">📦 منتجاتي الخاصة</h3><div id="list"></div></div>
<div class="card" style="text-align:center"><a href="index.html" style="color:#888;font-size:12px;margin:0 6px">الموقع</a><a href="orders.html" style="color:#888;font-size:12px;margin:0 6px">طلباتي</a><a href="admin.html" style="color:#ffaa00;font-size:12px;margin:0 6px">ادمن</a></div></div>
<script>
let mid=localStorage.getItem('talabak_current');if(!mid) location.href='login.html';let merchants=JSON.parse(localStorage.getItem('talabak_merchants')||'[]');let me=merchants.find(m=>m.id==mid);if(!me) location.href='login.html';shopName.innerText='🏪 '+me.shop;info.innerText=`ID: ${me.id} | تلفون: ${me.phone} | واتساب: ${me.wa||'249124341697'}`;let img='';cost.oninput=price.oninput=()=>{pr.innerText=(+price.value)>(+cost.value)?`ربحك: ${(+price.value)-(+cost.value)}ج`:''}
function load(i){let r=new FileReader();r.onload=e=>{img=e.target.result;prev.innerHTML=`<img src="${img}">`};r.readAsDataURL(i.files[0])}
function pub(){if(!name.value||!price.value||!img) return alert('اكمل');let all=JSON.parse(localStorage.getItem('talabak_global')||'[]');let p={id:Date.now(),merchantId:mid,shopName:me.shop,merchantPhone:me.phone,name:name.value,price:cost.value||price.value,sell:price.value,profit:(+price.value)-(+cost.value||+price.value),img:img,date:Date.now()};all.unshift(p);localStorage.setItem('talabak_global',JSON.stringify(all));name.value=cost.value=price.value='';img='';prev.innerHTML='📸';render()}
function render(){let all=JSON.parse(localStorage.getItem('talabak_global')||'[]');let mine=all.filter(x=>x.merchantId==mid);let orders=JSON.parse(localStorage.getItem('talabak_orders')||'[]');let myOrders=orders.filter(o=>o.items.some(it=>it.merchantId==mid));c1.innerText=mine.length;c2.innerText=myOrders.length;c3.innerText=mine.reduce((a,b)=>a+(+b.profit||0),0)+'ج';list.innerHTML=mine.map((p,i)=>`<div style="display:flex;gap:8px;background:#111;border:1px solid #222;border-radius:8px;padding:6px;margin:4px 0"><img src="${p.img}" style="width:45px;height:45px;border-radius:6px;object-fit:cover"><div><b style="font-size:12px">${p.name}</b><br><small style="color:#888">${p.sell}ج - ربح ${p.profit}ج</small></div><button onclick="del(${p.id})" style="margin-right:auto;background:#222;color:#fff;border:1px solid #333;padding:4px 8px;border-radius:6px">×</button></div>`).join('')||'<p style=color:#555;text-align:center;font-size:12px>لا يوجد</p>'}
function del(id){if(!confirm('تحذف؟')) return;let all=JSON.parse(localStorage.getItem('talabak_global')||'[]');all=all.filter(x=>x.id!=id);localStorage.setItem('talabak_global',JSON.stringify(all));render()}
function logout(){localStorage.removeItem('talabak_current');location.href='login.html'}render();
</script></body></html>
