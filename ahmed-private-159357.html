<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الادمن - التسعير</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{background:#0a0a0a;color:#fff;padding:15px}
h2{color:#ffaa00}
.card{background:#151515;border:1px solid #222;border-radius:15px;padding:15px;margin:10px 0}
input{width:100%;background:#000;border:1px solid #333;color:#fff;padding:10px;border-radius:10px;margin:5px 0}
.btn{background:#ffaa00;color:#000;border:none;padding:10px 15px;border-radius:10px;font-weight:700;cursor:pointer;width:100%;margin:5px 0}
.btn2{background:#222;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.profit{color:#00ff88;font-weight:700}
.small{font-size:12px;color:#888}
.prod{background:#1a1a1a;border-radius:12px;padding:12px;margin:8px 0;border:1px solid #2a2a2a}
</style>
</head>
<body>
<h2>🔒 لوحة الادمن - التسعير</h2>

<div class="card">
<h3>➕ اضافة منتج</h3>
<input id="p_name" placeholder="اسم المنتج">
<div class="grid">
<input id="p_cost" type="number" placeholder="سعر الشراء" oninput="calc()">
<input id="p_sell" type="number" placeholder="سعر البيع" oninput="calc()">
</div>
<div class="grid">
<input id="p_comm" type="number" placeholder="عمولة المسوق" oninput="calc()">
<div style="padding:10px">ربحك: <span id="calc_profit" class="profit">0</span></div>
</div>
<button class="btn" onclick="addProduct()">حفظ محلي</button>
</div>

<div class="card">
<button id="pubBtn" class="btn" onclick="publishAuto()" style="background:#00ff88;color:#000">📢 نشر اتوماتيك للجميع</button>
<div class="small">بدوس هنا المنتج يظهر لكل الزباين في المتجر الرئيسي</div>
</div>

<div class="card">
<h3>📦 منتجاتك (<span id="count">0</span>)</h3>
<div id="products_list"></div>
</div>

<script>
let products = JSON.parse(localStorage.getItem('products_db')||'[]');
function calc(){ 
 let c=+document.getElementById('p_cost').value||0, s=+document.getElementById('p_sell').value||0, m=+document.getElementById('p_comm').value||0;
 document.getElementById('calc_profit').innerText = s - c - m;
}
function addProduct(){
 let name=document.getElementById('p_name').value;
 if(!name) return alert('اكتب الاسم');
 let prod={id:Date.now(),name:name,cost:+p_cost.value||0,sell:+p_sell.value||0,comm:+p_comm.value||0,profit:(+p_sell.value - +p_cost.value - +p_comm.value)};
 products.push(prod); save(); p_name.value='';p_cost.value='';p_sell.value='';p_comm.value='';calc_profit.innerText='0';
}
function save(){localStorage.setItem('products_db', JSON.stringify(products));render();}
function del(id){if(!confirm('تحذف؟'))return;products=products.filter(p=>p.id!=id);save();}
function edit(id){let p=products.find(x=>x.id==id);let ns=prompt('سعر البيع الجديد',p.sell);if(ns==null)return;let nc=prompt('عمولة جديدة',p.comm);p.sell=+ns;p.comm=+(nc||p.comm);p.profit=p.sell-p.cost-p.comm;save();}
function render(){
 count.innerText=products.length;
 products_list.innerHTML=products.map(p=>`<div class="prod"><b>${p.name}</b><br><div class="grid" style="font-size:13px;margin-top:8px"><span>شراء:${p.cost}</span><span>بيع:${p.sell}</span><span>عمولة:${p.comm}</span><span class="profit">ربحك:${p.profit}</span></div><div class="grid" style="margin-top:8px"><button class="btn btn2" onclick="edit(${p.id})">تعديل</button><button class="btn btn2" onclick="del(${p.id})" style="color:#ff5555">حذف</button></div></div>`).join('')||'لا يوجد منتجات';
}
async function publishAuto(){
 let token=prompt('دخل GitHub Token:', localStorage.getItem('gh_token')||'');
 if(!token) return alert('لازم التوكن');
 localStorage.setItem('gh_token', token);
 let btn=document.getElementById('pubBtn');
 btn.innerText='جاري النشر...'; btn.disabled=true;
 try{
  let getRes=await fetch('https://api.github.com/repos/ahmad-talabak/mysite/contents/products.json');
  let getData=await getRes.json(); let sha=getData.sha;
  let content=btoa(unescape(encodeURIComponent(JSON.stringify(products,null,2))));
  let res=await fetch('https://api.github.com/repos/ahmad-talabak/mysite/contents/products.json',{
   method:'PUT',
   headers:{'Authorization':'token '+token,'Content-Type':'application/json'},
   body:JSON.stringify({message:'update products',content:content,sha:sha})
  });
  let data=await res.json();
  if(data.content){ alert('✅ اتنشر للجميع! خلال دقيقة بظهر في المتجر'); }else{ alert('خطأ: '+JSON.stringify(data).slice(0,200)); }
 }catch(e){ alert('خطأ: '+e.message); }
 btn.innerText='📢 نشر اتوماتيك للجميع'; btn.disabled=false;
}
render();
</script>
</body>
</html>
