<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الادمن</title>
<style>
body{background:#050505;color:#fff;font-family:system-ui;padding:15px}
.card{background:#111;border:1px solid #222;border-radius:15px;padding:15px;margin:10px 0}
.btn{padding:10px 18px;border-radius:25px;border:0;font-weight:bold;cursor:pointer;margin:3px}
.approve{background:#00ff88;color:#000}
.reject{background:#ff0040;color:#fff}
.pending{border-color:#ffaa00}
.approved{border-color:#00ff88}
h2{color:#ff0080}
</style>
</head>
<body>
<h2>لوحة تحكم طلبك - الادمن</h2>
<div class="card">
<h3>طلبات انضمام مسوقين</h3>
<div id="pendingList">جاري التحميل...</div>
</div>
<div class="card">
<h3>مسوقين معتمدين</h3>
<div id="approvedList"></div>
</div>
<div class="card">
<button class="btn" style="background:#333;color:#fff" onclick="if(confirm('تمسح كل البيانات؟')){localStorage.removeItem('marketers_db');location.reload()}">مسح قاعدة المسوقين</button>
<button class="btn" style="background:#333;color:#fff" onclick="location.href='index.html'">رجوع للمتجر</button>
</div>
<script>
function getDB(){return JSON.parse(localStorage.getItem('marketers_db')||'{"pending":[],"approved":[]}')}
function saveDB(db){localStorage.setItem('marketers_db',JSON.stringify(db));render()}
function render(){
 let db=getDB();
 let pDiv=document.getElementById('pendingList');
 let aDiv=document.getElementById('approvedList');
 if(db.pending.length==0) pDiv.innerHTML='<p style=color:#777>ما في طلبات جديدة</p>';
 else pDiv.innerHTML=db.pending.map(p=>`
  <div class="card pending">
   <b>${p.name}</b><br>📱 ${p.phone}<br><small style=color:#777>${p.time||''}</small><br><br>
   <button class="btn approve" onclick="approve('${p.phone}')">قبول</button>
   <button class="btn reject" onclick="reject('${p.phone}')">رفض</button>
   <button class="btn" style="background:#25D366;color:#fff" onclick="window.open('https://wa.me/${p.phone}')">واتساب</button>
  </div>`).join('');
 if(db.approved.length==0) aDiv.innerHTML='<p style=color:#777>لسه ما في مسوقين</p>';
 else aDiv.innerHTML=db.approved.map(ph=>`<div class="card approved">📱 ${ph}<button class="btn reject" style="float:left" onclick="removeApproved('${ph}')">حذف</button></div>`).join('');
}
function approve(phone){
 let db=getDB();
 if(!db.approved.includes(phone)) db.approved.push(phone);
 db.pending=db.pending.filter(p=>p.phone!=phone);
 saveDB(db);
 alert('تم قبول '+phone);
}
function reject(phone){
 if(!confirm('ترفض '+phone+' ؟')) return;
 let db=getDB();
 db.pending=db.pending.filter(p=>p.phone!=phone);
 saveDB(db);
}
function removeApproved(phone){
 if(!confirm('تحذف '+phone+' ؟')) return;
 let db=getDB();
 db.approved=db.approved.filter(p=>p!=phone);
 saveDB(db);
}
render();
</script>
</body>
</html>
