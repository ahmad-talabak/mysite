<!DOCTYPE html>
<html dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>انضم كمسوق - TALABAK</title>
<style>body{background:#0a0a0a;color:white;font-family:sans-serif;padding:20px;text-align:center}input,textarea{width:90%;max-width:400px;padding:14px;margin:8px;border-radius:12px;border:1px solid #333;background:#1a1a1a;color:white;font-size:16px}button{padding:15px 30px;background:#25D366;color:white;border:0;border-radius:30px;font-weight:bold;font-size:18px;cursor:pointer;width:90%;max-width:400px}.box{max-width:450px;margin:30px auto;background:#1a1a1a;padding:25px;border-radius:20px;border:1px solid #333}</style>
</head><body>
<div class="box">
<h1>💼 انضم كمسوق في TALABAK</h1>
<p>سجل واربح عمولة على كل بيعة</p>
<input id="name" placeholder="اسمك الكامل"><br>
<input id="phone" placeholder="رقم الواتساب 09..."><br>
<input id="city" placeholder="المدينة - امدرمان / الخرطوم"><br>
<textarea id="exp" placeholder="عندك خبرة تسويق؟"></textarea><br>
<button onclick="send()">ارسال طلب انضمام 🚀</button>
<p id="msg"></p>
</div>
<script>
function send(){
let n=document.getElementById('name').value, ph=document.getElementById('phone').value, city=document.getElementById('city').value, exp=document.getElementById('exp').value;
if(!n||!ph)return alert("اكتب اسمك ورقمك");
let data={name:n,phone:ph,city:city,exp:exp,date:new Date().toLocaleString()};
let list=JSON.parse(localStorage.getItem('mosawigin')||"[]");
list.push(data);
localStorage.setItem('mosawigin',JSON.stringify(list));
let text=`طلب مسوق جديد 🔥%0Aالاسم: ${n}%0Aالرقم: ${ph}%0Aالمدينة: ${city}%0Aالخبرة: ${exp}`;
document.getElementById('msg').innerHTML="✅ تم ارسال الطلب! سيتم قبولك قريبا";
setTimeout(()=>{window.open(`https://wa.me/249124341697?text=${text}`,"_blank")},1000);
}
</script>
</body></html>
