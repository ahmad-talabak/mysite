<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبك - السوق</title>
<style>body{font-family:sans-serif;background:#f8f9fa;margin:0}header{background:#25D366;color:white;padding:15px;text-align:center} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:15px} .card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,0.1)} .card img{width:100%;height:130px;object-fit:cover} .card div{padding:8px}</style>
</head><body>
<header><h2>🛒 طلبك - سوق أمدرمان</h2><a href="login.html" style="color:white">+ سجل متجرك</a></header>
<div class="grid" id="grid"></div>
<script src="firebase.js"></script>
<script>
async function loadMarket(){
 let prods = await FirebaseDB.getProducts();
 let stores = await FirebaseDB.getStores();
 let map={}; stores.forEach(s=>map[s._id]=s.name);
 document.getElementById("grid").innerHTML = prods.map(p=>`<div class="card"><img src="${p.image}" onerror="this.src='https://via.placeholder.com/150'"><div><b>${p.name}</b><br>${p.price} SDG<br><small>🏪 ${map[p.storeId]||'متجر'}</small><br><a href="https://wa.me/${(stores.find(s=>s._id===p.storeId)||{}).phone||''}?text=عايز ${p.name}" target="_blank" style="background:#25D366;color:white;padding:5px 10px;border-radius:6px;text-decoration:none;display:inline-block;margin-top:5px">اطلب واتساب</a></div></div>`).join("") || "<p>لا يوجد منتجات بعد</p>";
}
loadMarket();
</script></body></html>
