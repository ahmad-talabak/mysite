<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلبك - كل شي بطلبك</title>
<style>
*{box-sizing:border-box;font-family:system-ui}body{background:#0a0a0a;color:#fff;margin:0}
.header{background:linear-gradient(135deg,#ffaa00,#ff6a00);padding:20px 15px;text-align:center;position:sticky;top:0;z-index:10}
.header h1{margin:0;font-size:28px;color:#000}
.search{margin:12px auto 0;max-width:600px;display:flex;gap:6px}
.search input{flex:1;background:#000;color:#fff;border:1px solid #333;padding:12px;border-radius:12px}
.container{max-width:800px;margin:0 auto;padding:12px}
.top{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.cat{padding:8px 14px;border-radius:20px;border:1px solid #333;background:#111;color:#aaa;cursor:pointer;font-size:13px}
.cat.active{background:#ffaa00;color:#000;border-color:#ffaa00;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr 1fr}}
.prod{background:#151515;border:1px solid #222;border-radius:14px;padding:10px;text-align:center}
.prod b{display:block;margin:5px 0;font-size:14px}
.prod small{color:#888}
.price{color:#ffaa00;font-weight:900;font-size:16px;display:block;margin:4px 0}
.btn{background:#ffaa00;color:#000;border:none;padding:8px 12px;border-radius:8px;font-weight:800;cursor:pointer;width:100%;margin-top:4px;font-size:13px}
.btn2{background:#222;color:#fff;border:1px solid #333;padding:8px 12px;border-radius:8px;cursor:pointer;width:100%;margin-top:4px;font-size:12px}
.cart-bar{position:fixed;bottom:15px;left:15px;right:15px;background:#ffaa00;color:#000;padding:14px 18px;border-radius:15px;display:flex;justify-content:space-between;align-items:center;font-weight:900;box-shadow:0 5px 20px rgba(255,170,0,.4);z-index:20;cursor:pointer}
.card{background:#151515;border:1px solid #222;border-radius:15px;padding:15px;margin:10px 0}
</style></head>
<body>
<div class="header">
<h1>🛒 طلبك</h1>
<div class="search"><input id="q" placeholder="🔍 فتش: تلفون، ملابس، عطر..." oninput="filter()"><button class="btn" style="width:auto;padding:12px 16px" onclick="filter()">بحث</button></div>
</div>
<div class="container">
<div class="top" id="cats">
<span class="cat active" onclick="setCat('الكل',this)">الكل</span>
<span class="cat" onclick="setCat('الكترونيات',this)">📱 الكترونيات</span>
<span class="cat" onclick="setCat('ملابس',this)">👕 ملابس</span>
<span class="cat" onclick="setCat('عطور',this)">🌸 عطور</span>
<span class="cat" onclick="setCat('غذائية',this)">🍞 مواد غذائية</span>
</div>
<div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:10px 15px"><span>🏪 عندك محل؟ اعرض بضاعتك</span><a href="vendors.html" style="background:#fff;color:#000;padding:8px 14px;border-radius:8px;font-weight:800;text-decoration:none;font-size:13px">سجل محلك</a></div>
<div id="products" class="grid">جاري التحميل...</div>
</div>
<div id="cartBar" class="cart-bar" style="display:none" onclick="checkout()"><span id="cartText">🛒 0 منتج</span><span>اطلب الان ←</span></div>
<script>
let all=[], curCat='الكل', cart=[];
fetch('products.json').then(r=>r.json()).then(d=>{all=d;render(d)}).catch(()=>{document.getElementById('products').innerHTML='<p style=color:#666;text-align:center>لا يوجد منتجات - اضف من admin.html</p>'});
function setCat(c,el){curCat=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));el.classList.add('active');filter();}
function filter(){
let s=q.value.toLowerCase();
let f=all.filter(p=>{
let matchCat=curCat==='الكل'||(p.category||'').includes(curCat)||(p.name||'').includes(curCat);
let matchSearch=!s||(p.name||'').toLowerCase().includes(s)||(p.shopName||'').toLowerCase().includes(s);
return matchCat&&matchSearch;
});
render(f);
}
function render(list){
let c=document.getElementById('products');
if(!list.length){c.innerHTML='<p style=color:#666;text-align:center;padding:20px>😔 ما لقينا حاجة<br><small>جرب كلمة تانية</small></p>';return;}
c.innerHTML=list.map((p,i)=>`<div class="prod"><b>${p.name}</b><small>🏬 ${p.shopName||p.vendor||'طلبك'}</small><span class="price">${p.sell||p.price} ج</span><button class="btn" onclick="addCart(${all.indexOf(p)})">🛒 اضف للسلة</button><button class="btn2" onclick="buyOne(${all.indexOf(p)})">اطلب واتساب مباشر</button></div>`).join('');
}
function addCart(idx){let p=all[idx];cart.push(p);updateCart();}
function updateCart(){
if(!cart.length){cartBar.style.display='none';return;}
cartBar.style.display='flex';
cartText.innerText=`🛒 ${cart.length} منتج - ${cart.reduce((s,x)=>s+parseInt(x.sell||x.price||0),0)}ج`;
}
function buyOne(idx){
let p=all[idx];
let msg=`طلب جديد من طلبك%0A📦 ${p.name}%0A🏬 ${p.shopName||''}%0A💰 ${p.sell||p.price}ج`;
window.open(`https://wa.me/249000000000?text=${msg}`,'_blank');
}
function checkout(){
let total=cart.reduce((s,x)=>s+parseInt(x.sell||x.price||0),0);
let list=cart.map(x=>`• ${x.name} - ${x.sell||x.price}ج`).join('%0A');
let msg=`🛒 طلب جديد من طلبك - ${cart.length} منتج%0A%0A${list}%0A%0A💰 الاجمالي: ${total}ج%0A%0Aالاسم:%0Aالعنوان:%0Aرقم التلفون:`;
window.open(`https://wa.me/249000000000?text=${msg}`,'_blank');
cart=[];updateCart();
}
</script>
</body></html>
