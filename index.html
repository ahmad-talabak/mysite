<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبك</title>
<style>body{font-family:sans-serif;background:#f8f9fa;margin:0}header{background:#2e9d4a;color:white;padding:14px;display:flex;justify-content:space-between;align-items:center}header img{width:42px;height:42px;background:white;border-radius:10px;padding:3px}.top{display:flex;gap:8px;padding:12px}.top input{flex:1;padding:13px;border-radius:12px;border:1px solid #ddd;font-size:16px}.top button{padding:13px 14px;border-radius:12px;border:none;background:white;box-shadow:0 2px 5px rgba(0,0,0,.1);font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;padding:12px}.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.07)}.card img{width:100%;height:130px;object-fit:cover}.card div{padding:9px}.filters{display:none;padding:0 12px 10px;gap:6px;flex-wrap:wrap}.filters button{padding:8px 12px;border-radius:20px;border:1px solid #2e9d4a;background:white;color:#2e9d4a}.filters button.active{background:#2e9d4a;color:white}</style></head><body>
<header><div style="display:flex;align-items:center;gap:8px"><img src="logo.png" onerror="this.style.display='none'"><b>طلبك</b></div><a href="login.html" style="color:white;text-decoration:none;background:#ffffff33;padding:7px 12px;border-radius:8px">+ متجري</a></header>
<div class="top"><input id="q" oninput="doSearch()" placeholder="بحث"><button onclick="toggleOpts()">خيارات</button></div>
<div id="filters" class="filters">
<button onclick="filterCat('all',this)" class="active">الكل</button>
<button onclick="filterCat('ملابس',this)">ملابس</button>
<button onclick="filterCat('الكترونيات',this)">إلكترونيات</button>
<button onclick="filterCat('أحذية',this)">أحذية</button>
<button onclick="filterCat('مكياج',this)">مكياج</button>
<button onclick="filterCat('ساعات',this)">ساعات</button>
</div>
<div class="grid" id="grid"></div>
<script src="firebase.js"></script>
<script>
let all=[],map={},cur='all';
async function load(){all=await FirebaseDB.getProducts();let s=await FirebaseDB.getStores();s.forEach(x=>map[x._id]=x);render(all)}
function render(l){grid.innerHTML=l.map(p=>{let st=map[p.storeId]||{};return `<div class="card"><img src="${p.image}" onerror="this.src='https://via.placeholder.com/300'"><div><b>${p.name}</b><br><span style="color:#2e9d4a;font-weight:bold">${p.price} SDG</span><br><a href="https://wa.me/${st.phone||''}?text=عايز ${p.name}" target="_blank" style="background:#25D366;color:white;padding:6px;border-radius:7px;text-decoration:none;display:block;text-align:center;margin-top:6px">واتساب</a></div></div>`}).join("")||"<p style='padding:20px'>لا يوجد نتائج</p>"}
function doSearch(){let t=q.value.toLowerCase();let f=all.filter(p=>p.name.toLowerCase().includes(t));if(cur!=='all')f=f.filter(p=>p.name.toLowerCase().includes(cur.toLowerCase()));render(f)}
function toggleOpts(){let e=document.getElementById('filters');e.style.display=e.style.display==='flex'?'none':'flex'}
function filterCat(c,btn){cur=c;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');doSearch()}
load();
</script></body></html>
