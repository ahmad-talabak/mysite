<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبك - سوق امدرمان</title><style>*{box-sizing:border-box;font-family:system-ui}body{background:#000;color:#fff;margin:0}header{background:#111;padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}header b{color:#ffaa00}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;padding:10px}.card{background:#151515;border:1px solid #222;border-radius:12px;padding:10px} .btn{padding:8px 12px;background:#ffaa00;color:#000;border:0;border-radius:8px;font-weight:800;text-decoration:none;display:inline-block}</style></head><body><header><b>🛒 طلبك - امدرمان</b><div><a href="login.html" class="btn">سجل متجرك</a></div></header><div style="padding:10px;color:#888">منتجات من السحابة - بتستحمل الاف التجار</div><div id="grid" class="grid">جاري التحميل...</div><script>const API="https://crudcrud.com/api/b4a5c6d7e8f94a1b2c3d4e5f6a7b8c9d";async function load(){try{let r=await fetch(API+"/products");let ps=await r.json();if(!ps.length){grid.innerHTML='<p style=color:#888>لسه ما في منتجات - سجل اول واحد</p>';return;}grid.innerHTML=ps.map(p=>`<div class=card><div style=font-weight:800>${p.name}</div><div style=color:#888;font-size:12px>${p.shopName}</div><div style=margin:6px 0><b style=color:#ffaa00>${p.sell}ج</b> <small style=color:#0f5>ربح ${p.sell-p.buy}</small></div><a href="https://wa.me/${p.phone||''}?text=عايز ${p.name}" class=btn style=width:100%;text-align:center>واتساب</a></div>`).join('');}catch(e){grid.innerHTML='خطأ سيرفر مؤقت: '+e;}}load();</script></body></html>
