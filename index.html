<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>طلبك - كل شي بطلبك</title>
<style>*{box-sizing:border-box;font-family:system-ui}body{background:#0a0a0a;color:#fff;margin:0}.header{background:linear-gradient(135deg,#ffaa00,#ff6a00);padding:18px 12px;text-align:center;position:sticky;top:0;z-index:10}.header h1{margin:0;color:#000;font-size:26px}.search{margin:10px auto 0;max-width:600px;display:flex;gap:6px}.search input{flex:1;background:#000;color:#fff;border:1px solid #333;padding:12px;border-radius:12px}.container{max-width:800px;margin:0 auto;padding:10px}.cats{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.cat{padding:7px 12px;border-radius:20px;border:1px solid #333;background:#111;color:#aaa;font-size:12px}.cat.active{background:#ffaa00;color:#000;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.prod{background:#151515;border:1px solid #222;border-radius:12px;padding:8px;text-align:center}.prod img{width:100%;height:110px;object-fit:cover;border-radius:8px;background:#000}.prod b{font-size:13px;display:block;margin:5px 0}.price{color:#ffaa00;font-weight:900}.btn{background:#ffaa00;color:#000;border:none;padding:8px;border-radius:8px;font-weight:800;width:100%;margin-top:4px;font-size:12px}.cart{position:fixed;bottom:12px;left:12px;right:12px;background:#ffaa00;color:#000;padding:14px;border-radius:14px;display:flex;justify-content:space-between;font-weight:900;z-index:20}</style></head>
<body>
<div class="header"><h1>🛒 طلبك</h1><div class="search"><input id="q" placeholder="فتش..." oninput="draw()"></div></div>
<div class="container"><div class="cats" id="cats"><span class="cat active" onclick="setCat('الكل',this)">الكل</span><span class="cat" onclick="setCat('الكترونيات',this)">📱 الكترونيات</span><span class="cat" onclick="setCat('ملابس',this)">👕 ملابس</span></div>
<div style="background:#151515;border:1px solid #222;border-radius:12px;padding:10px;display:flex;justify-content:space-between;margin:8px 0"><span style="font-size:13px">🏪 تاجر؟ اضف بضاعتك</span><a href="tajer.html" style="background:#fff;color:#000;padding:6px 12px;border-radius:8px;text-decoration:none;font-weight:800;font-size:12px">افتح لوحة التاجر</a></div>
<div id="grid" class="grid"></div></div>
<div id="cartBar" class="cart" style="display:none" onclick="order()"><span id="cText"></span><span>اطلب ←</span></div>
<script>
let all=[],cart=[],cur='الكل';
function load(){
let local=JSON.parse(localStorage.getItem('talabak_global')||'[]');
fetch('products.json').then(r=>r.json()).then(j=>{all=[...local,...j];draw();}).catch(()=>{all=local;draw();if(!all.length) grid.innerHTML='<p style=text-align:center;color:#666;padding:20px>لا يوجد منتجات<br><a href=tajer.html style=color:#ffaa00>اضف اول منتج من لوحة التاجر</a></p>';});
}
function setCat(c,el){cur=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));el.classList.add('active');draw();}
function draw(){
let s=(q.value||'').toLowerCase();
let f=all.filter(p=>{
let catOk=cur==='الكل'||(p.name||'').includes(cur);
let searchOk=!s||(p.name||'').toLowerCase().includes(s)||(p.shopName||'').toLowerCase().includes(s);
return catOk&&searchOk;
});
grid.innerHTML=f.map((p,i)=>`<div class="prod"><img src="${p.img||'https://via.placeholder.com/200?text=طلبك'}" onerror="this.src='https://via.placeholder.com/200'"><b>${p.name}</b><small style=color:#888>${p.shopName||''}</small><span class="price">${p.sell||p.price} ج</span><button class="btn" onclick="add(${all.indexOf(p)})">اضف للسلة</button></div>`).join('')||'<p style=color:#666;text-align:center>ما لقينا</p>';
}
function add(i){cart.push(all[i]);upd();}
function upd(){if(!cart.length){cartBar.style.display='none';return;}cartBar.style.display='flex';cText.innerText=`🛒 ${cart.length} منتج - ${cart.reduce((s,x)=>s+parseInt(x.sell||x.price),0)}ج`;}
function order(){let t=cart.reduce((s,x)=>s+parseInt(x.sell||x.price),0);let l=cart.map(x=>`• ${x.name} - ${x.price}ج (${x.shopName||''})`).join('%0A');let m=`طلب من طلبك%0A%0A${l}%0A%0Aالاجمالي: ${t}ج`;window.open(`https://wa.me/249000000000?text=${m}`,'_blank');cart=[];upd();}
load();
</script>
</body></html>
