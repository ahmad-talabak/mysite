<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TALABAK STORE</title>
<style>
body{background:#0a0a0a;color:white;text-align:center;padding:20px;font-family:sans-serif;margin:0}
.logo{font-size:75px;font-weight:900;background:linear-gradient(90deg,#ff0080,#ff8c00,#ffee00,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 25px #ff0080);margin:30px 0}
.sub{color:#aaa;font-size:20px}
.search{width:90%;max-width:500px;padding:15px;border-radius:30px;border:1px solid #333;background:#1a1a1a;color:white;margin:20px 0}
.card{background:#1a1a1a;border:1px solid #333;border-radius:20px;padding:15px}
.price{color:#00ff88;font-size:22px;font-weight:bold}
.btn{display:block;background:#25D366;color:white;padding:12px;border-radius:30px;text-decoration:none;font-weight:bold;margin-top:10px}
</style>
</head>
<body>
<div class="logo">✨ TALABAK STORE ✨</div>
<div class="sub">🔥 أكبر متجر في السودان 🔥</div>
<input class="search" placeholder="ابحث هنا...">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;max-width:1000px;margin:40px auto">
  <div class="card">
    <img src="https://images.unsplash.com/photo-1592899677977-9bb10ba128a5?w=400" style="width:100%;border-radius:15px;height:250px;object-fit:cover">
    <h3>iPhone 15 Pro Max</h3>
    <p class="price">1,200,000 SDG</p>
    <a class="btn" href="https://wa.me/249124341697?text=سلام طلبك ستور عايز اطلب iPhone 15 Pro Max">طلب واتساب 📱</a>
  </div>
  <div class="card">
    <img src="https://images.unsplash.com/photo-1572569511254-d8f925fe2cbb?w=400" style="width:100%;border-radius:15px;height:250px;object-fit:cover">
    <h3>AirPods Pro</h3>
    <p class="price">85,000 SDG</p>
    <a class="btn" href="https://wa.me/249124341697?text=سلام طلبك ستور عايز اطلب AirPods">طلب واتساب 📱</a>
  </div>
  <div class="card">
    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" style="width:100%;border-radius:15px;height:250px;object-fit:cover">
    <h3>ساعة ذكية</h3>
    <p class="price">45,000 SDG</p>
    <a class="btn" href="https://wa.me/249124341697?text=سلام طلبك ستور عايز اطلب ساعة ذكية">طلب واتساب 📱</a>
  </div>
</div>
</body>
</html>
