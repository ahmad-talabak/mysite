<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>طلبك - كل شي بطلبك</title><style>*{box-sizing:border-box;font-family:system-ui}body{background:#0a0a0a;color:#fff;margin:0}.h{background:linear-gradient(135deg,#ffaa00,#ff6a00);padding:14px;text-align:center;position:sticky;top:0;z-index:9}.s{max-width:600px;margin:8px auto;display:flex;gap:6px}.s input{flex:1;background:#000;color:#fff;border:1px solid #333;padding:10px;border-radius:10px}.c{max-width:800px;margin:auto;padding:10px}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.p{background:#151515;border:1px solid #222;border-radius:12px;padding:8px;text-align:center}.p img{width:100%;height:115px;object-fit:cover;border-radius:8px;background:#000}.pr{color:#ffaa00;font-weight:900}.b{background:#ffaa00;color:#000;border:none;padding:7px;border-radius:8px;font-weight:800;width:100%;margin-top:4px;font-size:11px}.cart{position:fixed;bottom:10px;left:10px;right:10px;background:#ffaa00;color:#000;padding:12px;border-radius:12px;display:flex;justify-content:space-between;font-weight:900;z-index:20}.top{background:#151515;border:1px solid #222;border-radius:10px;padding:8px;display:flex;justify-content:space-between;align-items:center;font-size:12px}</style></head><body><div class="h"><h1>🛒 طلبك</h1><div class="s"><input id="q" placeholder="فتش..." oninput="draw()"></div></div><div class="c"><div class="top"><span>🏪 كل تاجر عندو متجر براهو</span><a href="login.html" style="background:#fff;color:#000;padding:5px 10px;border-radius:8px;text-decoration:none;font-weight:800">دخول تاجر</a></div><div id="grid" class="g"></div></div><div id="bar" class="cart" style="display:none" onclick="order()"><span id="txt"></span><span>اطلب واتساب ←</span></div>
<script>let all=[],cart=[];function load(){let l=JSON.parse(localStorage.getItem('talabak_global')||'[]');fetch('products.json').then(r=>r.json()).then(j=>{all=[...l,...j];draw()}).catch(()=>{all=l;draw()})}function draw(){let s=q.value.toLowerCase();let f=all.filter(p=>!s||(p.name+p.shopName).toLowerCase().includes(s));grid.innerHTML=f.map((p,i)=>`<div class="p"><img src="${p.img}" onerror="this.src='https://via.placeholder.com/200'"><b style="font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</b><small style="color:#888">${p.shopName||''}</small><div class="pr">${p.sell||p.price}ج</div><button class="b" onclick="add(${all.indexOf(p)})">اضف</button></div>`).join('')||'<p style=color:#666;text-align:center>لا يوجد منتجات<br><a href=login.html style=color:#ffaa00>سجل كتاجر</a></p>'}function add(i){cart.push(all[i]);up()}function up(){if(!cart.length){bar.style.display='none';return}bar.style.display='flex';txt.innerText=`🛒 ${cart.length} - ${cart.reduce((a,b)=>a+parseInt(b.sell||b.price),0)}ج`}function order(){let wa=localStorage.getItem('talabak_wa')||'249124341697';let t=cart.reduce((a,b)=>a+parseInt(b.sell||b.price),0);let list=cart.map(x=>`• ${x.name} من ${x.shopName} - ${x.sell}ج`).join('%0A');let msg=`طلب جديد - طلبك%0A%0A${list}%0A%0Aالاجمالي: ${t}ج`;let ord={items:[...cart],total:t,date:new Date().toLocaleString('ar-SD')};let arr=JSON.parse(localStorage.getItem('talabak_orders')||'[]');arr.unshift(ord);localStorage.setItem('talabak_orders',JSON.stringify(arr));window.open(`https://wa.me/${wa}?text=${msg}`,'_blank');cart=[];up()}load();</script></body></html>
