<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متجر شندي</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#f5f5f5}header{background:#111;color:#fff;padding:15px;text-align:center;position:sticky;top:0;z-index:10}.tabs button{padding:8px 15px;border-radius:20px;border:none;background:#333;color:#fff;margin:3px}button{cursor:pointer}.view{display:none;padding:15px}.view.active{display:block}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.card{background:#fff;border-radius:10px;padding:10px;text-align:center}.card img{width:100%;height:140px;object-fit:cover;border-radius:8px}</style>
</head><body>
<header><h2>متجر شندي 🛒</h2>
<button onclick="show('store')">المتجر</button>
<button onclick="show('mkt')">المسوقين</button>
<button onclick="login()" style="background:#25D366;color:#fff;padding:8px 15px;border-radius:20px;border:none">لوحة المدير 🔒</button>
</header>
<div id="store" class="view active"><h3 style="text-align:center">المنتجات</h3><div id="list" class="products" style="margin-top:15px"></div></div>
<div id="mkt" class="view"><div style="background:#fff;padding:15px;border-radius:10px;max-width:400px;margin:auto"><h3>انضم كمسوق</h3><input id="mn" placeholder="اسمك" style="width:100%;padding:10px;margin:5px 0"><input id="mp" placeholder="واتساب 249xxx" style="width:100%;padding:10px;margin:5px 0"><input id="mc" placeholder="كودك ahmed" style="width:100%;padding:10px;margin:5px 0"><button onclick="reg()" style="width:100%;padding:10px;background:#111;color:#fff;border:none;border-radius:8px">تسجيل</button><p id="msg" style="text-align:center;margin-top:10px;color:green"></p></div></div>
<div id="admin" class="view"><div style="background:#fff;padding:15px;border-radius:10px"><h2>انت المدير ✅</h2><p>كلمة السر: Ahmed 159357</p><hr style="margin:10px 0"><h3>اضافة منتج</h3><input id="pn" placeholder="اسم المنتج" style="width:100%;padding:8px;margin:4px"><input id="pp" placeholder="السعر" style="width:100%;padding:8px;margin:4px"><button onclick="add()" style="width:100%;padding:10px;background:green;color:#fff;border:none;border-radius:8px">اضافة</button><hr style="margin:15px 0"><h3>المسوقين</h3><div id="mlist"></div></div></div>
<script>
let prods=JSON.parse(localStorage.getItem('prods')||'[{"n":"تيشيرت","p":"5000 جنيه"}]');let mks=JSON.parse(localStorage.getItem('mks')||'[]');
let ref=new URLSearchParams(location.search).get('ref');let phone="249124341697";if(ref){let f=mks.find(x=>x.c==ref);if(f)phone=f.p;}
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');render();}
function render(){document.getElementById('list').innerHTML=prods.map((p,i)=>`<div class="card"><img src="https://via.placeholder.com/300?text=${p.n}"><h4>${p.n}</h4><p>${p.p}</p><a href="https://wa.me/${phone}?text=اريد ${p.n}" target="_blank"><button style="background:#25D366;color:#fff;width:90%;padding:8px;border:none;border-radius:20px">اطلب واتساب</button></a>${document.getElementById('admin').classList.contains('active')?`<br><button onclick="prods.splice(${i},1);localStorage.setItem('prods',JSON.stringify(prods));render()" style="background:red;color:#fff;margin-top:5px;padding:5px;border:none;border-radius:10px">حذف</button>`:''}</div>`).join('');document.getElementById('mlist').innerHTML=mks.map((x,i)=>`<div style="border:1px solid #ddd;padding:8px;margin:5px;border-radius:8px">${x.n} | ${x.p} | كود:${x.c} | رابط: ?ref=${x.c} <br><button onclick="mks.splice(${i},1);save()" style="background:red;color:#fff;border:none;padding:5px;border-radius:5px">حذف</button></div>`).join('')||'لا يوجد مسوقين بعد';}
function add(){if(!pn.value)return;prods.push({n:pn.value,p:pp.value});localStorage.setItem('prods',JSON.stringify(prods));pn.value='';pp.value='';render();}
function reg(){mks.push({n:mn.value,p:mp.value,c:mc.value.toLowerCase()});localStorage.setItem('mks',JSON.stringify(mks));msg.innerText='تم التسجيل! رابطك هو: ?ref='+mc.value;render();}
function save(){localStorage.setItem('mks',JSON.stringify(mks));render();}
function login(){let a=prompt('ادخل كلمة سر المدير');if(a==='Ahmed 159357'){alert('مرحبا يا مدير');show('admin');}else alert('كلمة السر خطأ');}
render();
</script></body></html>
