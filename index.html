<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلبك - كل شي بطلبك</title>
<style>
*{box-sizing:border-box;font-family:system-ui}body{background:#0a0a0a;color:#fff;margin:0}
.header{background:linear-gradient(135deg,#ffaa00,#ff6a00);padding:25px 15px;text-align:center}
.header h1{margin:0;font-size:32px;color:#000}.header p{margin:5px 0 0;color:#000;font-weight:700}
.container{max-width:700px;margin:0 auto;padding:15px}
.card{background:#151515;border:1px solid #222;border-radius:15px;padding:15px;margin:10px 0}
.btn{background:#ffaa00;color:#000;border:none;padding:12px 18px;border-radius:10px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prod{background:#111;border:1px solid #222;border-radius:12px;padding:10px;text-align:center}
.prod b{display:block;margin:6px 0}
</style></head>
<body>
<div class="header">
<h1>🛒 طلبك</h1>
<p>اطلب اي شي - يجيك لحد عندك</p>
</div>
<div class="container">
<div class="card" style="display:flex;justify-content:space-between;align-items:center">
<span>🏪 عندك محل؟</span><a class="btn" href="vendors.html">سجل محلك</a>
</div>
<div class="card">
<h3 style="color:#ffaa00;margin:0 0 10px">🔥 منتجات طلبك</h3>
<div id="products" class="grid">جاري التحميل...</div>
</div>
</div>
<script>
fetch('products.json').then(r=>r.json()).then(data=>{
let c=document.getElementById('products');
if(!data.length) c.innerHTML='<p style=color:#666>لا يوجد منتجات حاليا - التجار بيسجلو</p>';
else c.innerHTML=data.map(p=>`<div class="prod"><b>${p.name}</b><small>🏬 ${p.vendor||p.shopName||'طلبك'}</small><br><span style=color:#ffaa00;font-weight:800>${p.sell||p.price}ج</span><br><a class="btn" style="margin-top:6px;padding:8px 12px;font-size:13px" href="https://wa.me/249000000000?text=اريد ${encodeURIComponent(p.name)}">اطلب واتساب</a></div>`).join('');
}).catch(()=>{document.getElementById('products').innerHTML='لا يوجد products.json بعد - اضف من admin.html'});
</script>
</body></html>
