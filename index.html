<!DOCTYPE html><html dir=rtl><head><meta charset=UTF-8><title>store</title><style>body{background:#f5f5f5;font-family:sans-serif}header{background:#111;color:#fff;padding:15px;text-align:center}.view{display:none;padding:15px}.view.active{display:block}.products{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border-radius:12px;padding:10px;text-align:center}.own{border:2px solid green}</style></head><body><header><h2>🛒 TALABAK STORE 🛒</h2><button onclick="show('store')">store</button> <button onclick="show('mkt')">mkt</button></header><div id=store class="view active"><h3 id=t></h3><div id=list class=products></div></div><div id=mkt class=view><div style="background:#fff;padding:20px;max-width:400px;margin:auto;border-radius:15px"><div id=loginBox><input id=mc placeholder=code style="width:100%;padding:12px"><button onclick="reg()" style="width:100%;padding:12px;background:#111;color:#fff">login</button><input id=mn placeholder=name style="width:100%;padding:8px;margin-top:5px"><input id=mp placeholder=phone style="width:100%;padding:8px;margin-top:5px"></div><div id=dashBox style=display:none><h3>hi <span id=dashName></span></h3><input id=pn placeholder=product style="width:100%;padding:8px"><input id=pp placeholder=price style="width:100%;padding:8px;margin-top:4px"><button onclick="addMyProd()" style="width:100%;padding:10px;background:green;color:#fff;margin-top:5px">add</button><button onclick="show('store')" style="width:100%;padding:8px;background:#111;color:#fff;margin-top:10px">see all - delete only yours</button><button onclick="logoutMkt()" style="width:100%;padding:8px;background:red;color:#fff;margin-top:5px">logout</button></div></div></div><script>let prods=JSON.parse(localStorage.getItem('prods')||'[]');let mks=JSON.parse(localStorage.getItem('mks')||'[]');let cur=localStorage.getItem('currentMkt')||'';function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');render();}function render(){let list=document.getElementById('list');document.getElementById('t').innerText=cur?'ALL PRODUCTS ('+prods.length+') GREEN=Yours':'ALL ('+prods.length+')';list.innerHTML=prods.map(p=>{let idx=prods.indexOf(p);let isMine=cur&&p.ownerCode==cur;return '<div class=card '+(isMine?'own':'')+'><b>'+p.n+'</b><br>'+p.p+'<br><small>'+p.ownerCode+'</small>'+(isMine?'<br><small>Yours</small>':'')+'<br><button onclick=order(\''+p.ownerCode+'\',\''+p.n+'\') style=background:green;color:#fff>order</button>'+(isMine?'<br><button onclick=prods.splice('+idx+',1);save() style=background:red;color:#fff>delete yours</button>':'')+'</div>';}).join('')||'empty';if(cur){let me=mks.find(m=>m.c==cur);if(me){document.getElementById('loginBox').style.display='none';document.getElementById('dashBox').style.display='block';document.getElementById('dashName').innerText=me.n;}}}function save(){localStorage.setItem('prods',JSON.stringify(prods));localStorage.setItem('mks',JSON.stringify(mks));render();}function addMyProd(){prods.push({n:pn.value,p:pp.value,ownerCode:cur});save();show('store');}function reg(){let c=mc.value.toLowerCase().trim();if(!c)return;let ex=mks.find(m=>m.c==c);if(!ex)mks.push({n:mn.value||c,p:mp.value||'249',c:c});cur=c;localStorage.setItem('currentMkt',c);localStorage.setItem('mks',JSON.stringify(mks));render();show('store');}function logoutMkt(){localStorage.removeItem('currentMkt');cur='';document.getElementById('loginBox').style.display='block';document.getElementById('dashBox').style.display='none';show('store');}function order(oc,n){let m=mks.find(x=>x.c==oc);let ph=m?m.p:'249124341697';window.open('https://wa.me/'+ph+'?text='+n);}render();</script></body></html>
