<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجري - أفضل المنتجات</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#0a0a0a;color:#fff}
.header{background:#111;border-bottom:1px solid #222;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
.header h1{color:#ffaa00;font-size:22px}
.container{max-width:1100px;margin:0 auto;padding:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:#151515;border:1px solid #222;border-radius:18px;overflow:hidden}
.card-img{height:140px;background:linear-gradient(135deg,#1a1a1a,#2a2a2a);display:flex;align-items:center;justify-content:center;font-size:40px}
.card-body{padding:12px}
.card-title{font-size:14px;font-weight:700;height:36px;overflow:hidden}
.price-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.price{color:#ffaa00;font-weight:800}
.badge{background:#00ff88;color:#000;font-size:10px;padding:3px 7px;border-radius:20px;font-weight:800}
.btn{width:100%;background:#ffaa00;color:#000;border:none;padding:11px;border-radius:12px;font-weight:800;margin-top:10px;cursor:pointer}
.search{width:100%;background:#151515;border:1px solid #222;color:#fff;padding:12px 15px;border-radius:12px;margin:12px 0}
</style>
</head>
<body>
<div class="header"><h1>🛒 متجري الالكتروني</h1><p>توصيل لكل السودان</p></div>
<div class="container">
<input id="search" class="search" placeholder="🔍 ابحث..." oninput="filterProducts()">
<div id="products" class="grid"><div style="text-align:center;padding:40px">جاري التحميل...</div></div>
</div>
<script>
let allProducts=[];
async function load(){
 try{
  let res=await fetch('./products.json?v='+Date.now());
  allProducts=await res.json();
  render(allProducts);
 }catch(e){document.getElementById('products').innerHTML='لا يوجد منتجات بعد';}
}
function render(list){
 if(!list.length){document.getElementById('products').innerHTML='لا يوجد منتجات';return;}
 document.getElementById('products').innerHTML=list.map(p=>`
  <div class="card">
   <div class="card-img">📦</div>
   <div class="card-body">
    <div class="card-title">${p.name}</div>
    <div class="price-row"><span class="price">${p.sell} ج</span><span class="badge">متوفر</span></div>
    <button class="btn" onclick="order('${p.name.replace(/'/g,"\\'")}',${p.sell})">اطلب واتساب</button>
   </div>
  </div>`).join('');
}
function filterProducts(){
 let q=document.getElementById('search').value.toLowerCase();
 render(allProducts.filter(p=>p.name.toLowerCase().includes(q)));
}
function order(name,price){
 let msg=`مرحبا اريد ${encodeURIComponent(name)} بسعر ${price}`;
 window.open(`https://wa.me/249124341697?text=${msg}`,'_blank');
}
load();
</script>
</body>
</html>
