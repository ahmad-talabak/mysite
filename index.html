<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متجر شندي</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#f5f5f5}header{background:#111;color:#fff;padding:15px;text-align:center}button{cursor:pointer}.tabs{display:flex;justify-content:center;gap:10px;margin-top:10px}.tabs button{padding:8px 15px;border-radius:20px;border:none;background:#333;color:#fff}.tabs button.active{background:#25D366}.view{display:none;padding:15px}.view.active{display:block}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.card{background:#fff;border-radius:10px;text-align:center;padding:10px}.card img{width:100%;height:150px;object-fit:cover}</style></head><body>
<header><h2>متجر شندي</h2><div class="tabs"><button onclick="show('store')">المتجر</button><button onclick="show('mkt')">انضم كمسوق</button><button onclick="login()">ادارة 🔒</button></div></header>
<div id="store" class="view active"><div id="list" class="products"></div></div>
<div id="mkt" class="view"><input id="mn" placeholder="اسمك" style="width:100%;padding:10px;margin:5px"><input id="mp" placeholder="رقم واتساب 249xxx" style="width:100%;padding:10px;margin:5px"><input id="mc" placeholder="كودك" style="width:100%;padding:10px;margin:5px"><button onclick="reg()" style="width:100%;padding:10px;background:#111;color:#fff">تسجيل</button><p id="msg"></p></div>
<div id="admin" class="view"><input id="pn" placeholder="اسم المنتج" style="width:100%;padding:8px"><input id="pp" placeholder="السعر" style="width:100%;padding:8px"><button onclick="add()" style="width:100%;padding:10px;background:green;color:#fff">اضافة منتج</button><div id="mlist"></div></div>
<script>
let prods=JSON.parse(localStorage.getItem('prods')||'[]');let mks=JSON.parse(localStorage.getItem('mks')||'[]');
let ref=new URLSearchParams(location.search).get('ref');let phone="249124341697";if(ref){let f=mks.find(x=>x.c==ref);if(f)phone=f.p;}
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');render();}
function render(){document.getElementById('list').innerHTML=prods.map(p=>`<div class="card"><img src="https://via.placeholder.com/200"><h4>${p.n}</h4><p>${p.p}</p><a href="https://wa.me/${phone}?text=اريد ${p.n}" target="_blank"><button style="background:#25D366;color:#fff;width:90%;padding:8px;border:none;border-radius:10px">اطلب واتساب</button></a></div>`).join('');document.getElementById('mlist').innerHTML=mks.map((x,i)=>`<div>${x.n} - ${x.p} - ${x.c} <button onclick="mks[${i}].ok=true;save()">موافقة</button><button onclick="mks.splice(${i},1);save()">حذف</button> رابط: ?ref=${x.c}</div>`).join('');}
function add(){prods.push({n:pn.value,p:pp.value});localStorage.setItem('prods',JSON.stringify(prods));render();}
function reg(){mks.push({n:mn.value,p:mp.value,c:mc.value.toLowerCase(),ok:false});localStorage.setItem('mks',JSON.stringify(mks));msg.innerText='تم، رابطك بعد الموافقة ?ref='+mc.value;render();}
function save(){localStorage.setItem('mks',JSON.stringify(mks));render();}
function login(){let a=prompt('كلمة السر');if(a=='Ahmed 159357')show('admin');else alert('خطأ');}
render();
</script></body></html>
