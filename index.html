<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>طلبك - السوق السوداني</title><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>body{font-family:sans-serif;background:#f5f5f5;margin:0}.header{background:#111827;color:#fff;padding:14px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:9}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}.card img{width:100%;height:150px;object-fit:cover}.card-body{padding:10px}.price{color:#e11d48;font-weight:bold}.btn{width:100%;padding:10px;border:none;border-radius:10px;background:#111827;color:#fff;font-weight:bold;margin-top:6px}</style>
</head><body>
<div class="header"><b><i class="fa fa-store"></i> طلبك</b><a href="dashboard.html" style="color:#fff;text-decoration:none"><i class="fa fa-user"></i> متجري</a></div>
<div id="products" class="grid">جاري التحميل من Firebase...</div>
<script type="module" src="firebase.js"></script>
<script type="module">
setTimeout(async()=>{
  try{
    const prods = await window.FirebaseDB.getProducts();
    if(prods.length===0){ document.getElementById('products').innerHTML='<div style="grid-column:span 2;text-align:center;padding:30px">لا يوجد منتجات بعد<br>كن أول من يضيف!</div>'; return; }
    document.getElementById('products').innerHTML = prods.map(p=>`
      <div class="card"><img src="${p.image}" onerror="this.src='https://via.placeholder.com/300'">
      <div class="card-body"><b>${p.name}</b><br><span class="price">${p.price} SDG</span><br><small style="color:#666">${p.desc||''}</small>
      <button class="btn" onclick="window.open('https://wa.me/249900000000?text=اريد ${p.name}','_blank')">اطلب واتساب</button></div></div>
    `).join('');
  }catch(e){ document.getElementById('products').innerText = 'خطأ: '+e.message }
},800);
</script></body></html>
