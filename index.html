<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر شندي</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f5f5f5}
header{background:#111;color:#fff;padding:20px;text-align:center}
header input{width:90%;max-width:400px;padding:12px;margin-top:15px;border-radius:25px;border:none;text-align:center;font-size:16px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;padding:20px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.1);text-align:center}
.card img{width:100%;height:200px;object-fit:cover}
.card h3{margin:10px 0}
.card p{color:green;font-weight:bold}
.card button{background:#25D366;color:#fff;border:none;padding:10px 20px;margin:10px;border-radius:20px;cursor:pointer;width:90%}
</style>
</head>
<body>
<header>
<h1>متجر شندي 🛒</h1>
<p>اطلب الآن عبر واتساب</p>
<input type="text" id="search" placeholder="ابحث عن المنتج..." onkeyup="searchProduct()">
</header>
<div class="products" id="products">
<div class="card"><img src="https://via.placeholder.com/300x200?text=تيشيرت"><h3>تيشيرت رجالي</h3><p>5000 جنيه</p><button onclick="order('تيشيرت رجالي')">اطلب واتساب</button></div>
<div class="card"><img src="https://via.placeholder.com/300x200?text=ساعة"><h3>ساعة يد</h3><p>12000 جنيه</p><button onclick="order('ساعة يد')">اطلب واتساب</button></div>
<div class="card"><img src="https://via.placeholder.com/300x200?text=سماعة"><h3>سماعة بلوتوث</h3><p>8000 جنيه</p><button onclick="order('سماعة بلوتوث')">اطلب واتساب</button></div>
<div class="card"><img src="https://via.placeholder.com/300x200?text=حذاء"><h3>حذاء رياضي</h3><p>15000 جنيه</p><button onclick="order('حذاء رياضي')">اطلب واتساب</button></div>
</div>
<script>
function order(product){
let phone="249124341697";
let msg=`مرحبا اريد طلب ${product} من متجر شندي`;
window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,"_blank");
}
function searchProduct(){
let input=document.getElementById('search').value.toLowerCase();
let cards=document.getElementsByClassName('card');
for(let i=0;i<cards.length;i++){
let title=cards[i].getElementsByTagName('h3')[0].innerText.toLowerCase();
cards[i].style.display=title.includes(input)?'':'none';
}
}
</script>
</body>
</html>
